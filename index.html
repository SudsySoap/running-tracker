<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <title>100 Mile Running Tracker</title>
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">RUNNING TRACKER</div>
      <h1 id="monthTitle">September 2026</h1>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
  </header>

  <main>
    <section class="card hero">
      <div class="goal-ring" id="goalRing">
        <div><strong id="milesDone">0.0</strong><span>/ 100 mi</span></div>
      </div>
      <div class="hero-copy">
        <h2 id="percentDone">0%</h2>
        <p id="milesRemaining">100.0 miles remaining</p>
        <div class="progress"><div id="progressFill"></div></div>
        <p class="muted" id="paceToGoal">Log your first run to get started.</p>
      </div>
    </section>

    <section class="stats">
      <div class="stat card"><span>Runs</span><strong id="runCount">0</strong></div>
      <div class="stat card"><span>Avg. distance</span><strong id="avgDistance">0.0 mi</strong></div>
      <div class="stat card"><span>Avg. pace</span><strong id="avgPace">—</strong></div>
    </section>

    <section class="card">
      <div class="section-head"><h2>Cumulative progress</h2><span id="goalLabel">Goal: 100 mi</span></div>
      <canvas id="chart" height="230"></canvas>
    </section>

    <button id="addRunBtn" class="primary">＋ Log a run</button>

    <section class="card">
      <div class="section-head"><h2>Recent runs</h2><button id="viewAllBtn" class="text-btn">View all</button></div>
      <div id="recentRuns" class="runs"></div>
    </section>
  </main>

  <dialog id="runDialog">
    <form method="dialog" id="runForm">
      <div class="dialog-head"><h2>Log a run</h2><button type="button" class="icon-btn" id="closeRun">✕</button></div>
      <input type="hidden" id="runId">
      <label>Date<input type="date" id="runDate" required></label>
      <label>Distance (miles)<input type="number" id="distance" min="0.01" step="0.01" placeholder="3.10" required></label>
      <div class="two">
        <label>Minutes<input type="number" id="minutes" min="0" step="1" placeholder="25" required></label>
        <label>Seconds<input type="number" id="seconds" min="0" max="59" step="1" placeholder="10" value="0" required></label>
      </div>
      <div class="preview" id="pacePreview">Pace: —</div>
      <div class="dialog-actions"><button type="button" class="secondary" id="cancelRun">Cancel</button><button class="primary" value="default">Save run</button></div>
    </form>
  </dialog>

  <dialog id="historyDialog">
    <div class="dialog-head"><h2>Run history</h2><button class="icon-btn" id="closeHistory">✕</button></div>
    <div id="allRuns" class="runs"></div>
  </dialog>

  <dialog id="settingsDialog">
    <form method="dialog" id="settingsForm">
      <div class="dialog-head"><h2>Settings</h2><button type="button" class="icon-btn" id="closeSettings">✕</button></div>
      <label>Monthly mileage goal<input type="number" id="goalInput" min="1" step="1" value="100"></label>
      <div class="dialog-actions"><button type="button" class="secondary" id="resetData">Delete all runs</button><button class="primary" value="default">Save</button></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
